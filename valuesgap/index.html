<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Values Gap Finder · DayOne100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single narrow column; one statement per screen; results as a ranked ledger with paired "want" / "living" bars */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#18222b; --muted:#5b6a70; --line:#d6dedd;
  --future:#0e7468; --future-soft:#cfe7e3; --present:#b8741a; --present-soft:#f3e2c7;
  --alert:#b23b3b; --alert-soft:#f6dcdc;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11181c; --surface:#18232a; --ink:#e7eeee; --muted:#9aaab0; --line:#2b3a42;
  --future:#45b8a8; --future-soft:#173a37; --present:#e0a24a; --present-soft:#3d2e17;
  --alert:#e57b7b; --alert-soft:#3d1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181c; --surface:#18232a; --ink:#e7eeee; --muted:#9aaab0; --line:#2b3a42;
  --future:#45b8a8; --future-soft:#173a37; --present:#e0a24a; --present-soft:#3d2e17;
  --alert:#e57b7b; --alert-soft:#3d1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,7vw,40px)}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:600 15px var(--body);border-radius:10px;padding:12px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.pick:focus-visible,textarea:focus-visible{outline:3px solid var(--future);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.steps{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.steps b{color:var(--ink)}
/* Quiz */
.phase{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tag{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tag.f{color:var(--future)} .tag.p{color:var(--present)}
.count{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stmt{font-family:var(--display);font-size:clamp(22px,5.6vw,28px);line-height:1.25;min-height:4.2em}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{font:700 18px var(--body);aspect-ratio:1/1;max-width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.opt:hover{border-color:var(--accent)}
.opt.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:12px}
/* Ranking */
.picks{display:flex;flex-direction:column;gap:8px}
.pick{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.pick .num{width:32px;height:32px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.pick.on{border-color:var(--future)}
.pick.on .num{background:var(--future);border:0;color:var(--surface)}
.pick .txt{min-width:0;display:flex;flex-direction:column}
.pick .txt span{font-size:13px;color:var(--muted)}
.pick .w{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sticky{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 6px 24px rgba(0,0,0,.12)}
/* Results */
.tier{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.vrow .rk{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;grid-row:span 3;align-self:start;padding-top:2px}
.vrow .nm{font-weight:700;min-width:0}
.vrow .bars{grid-column:2 / 4;display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:52px 1fr 30px;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar b{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar b i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.bar.f b i{background:var(--future)} .bar.p b i{background:var(--present)}
.vrow .def{grid-column:2 / 4;font-size:13px;color:var(--muted)}
.gap{display:inline-block;flex-shrink:0;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.gap.big{background:var(--alert-soft);color:var(--alert)}
.gap.mid{background:var(--present-soft);color:var(--present)}
.gap.ok{background:var(--future-soft);color:var(--future)}
.gap.over{background:var(--line);color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat strong{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.stat .eyebrow{font-size:11px}
.stat .muted{font-size:13px;line-height:1.35}
.items{display:flex;flex-direction:column;gap:16px;margin:0;padding:0;list-style:none}
.item{display:flex;flex-direction:column;gap:6px;min-width:0}
.item-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item-head strong{font-size:17px}
.item p{font-size:14px;color:var(--muted)}
.pair{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;background:var(--bg)}
.pair strong{font-size:15px}
.pair p{font-size:14px;color:var(--muted)}
.plan{display:flex;flex-direction:column;gap:18px}
.plan label{font-size:13px;font-weight:600;color:var(--muted)}
.plan textarea{width:100%;min-height:64px;resize:vertical;font:15px/1.4 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.field{display:flex;flex-direction:column;gap:4px}
.saved{font-size:12px;color:var(--future);min-height:1em}
.explain{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.explain:first-of-type{border-top:0;padding-top:4px}
.explain p{font-size:15px}
.explain .st{font-size:14px;color:var(--muted)}
.sub{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:4px}
.explain ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.careers{display:flex;flex-wrap:wrap;gap:6px}
.careers span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--future-soft);color:var(--ink)}
.read{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px;align-items:baseline}
.read b{white-space:nowrap}
.read span{color:var(--muted);min-width:0}
.fit{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.fit li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--bg)}
.fit li strong{font-size:15px;min-width:0}
.fit li em{font-style:normal;font-size:12px;font-weight:700;color:var(--future);white-space:nowrap}
.fit li span{grid-column:1 / 3;font-size:13px;color:var(--muted)}
details.more{grid-column:2 / 4;font-size:14px}
details.more summary{cursor:pointer;color:var(--future);font-weight:600;font-size:13px;padding-block:2px}
details.more[open]{display:flex;flex-direction:column;gap:8px}
details.more ul{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.banner{font-size:13px;background:var(--present-soft);color:var(--ink);border-radius:10px;padding:10px 12px}
.note{font-size:13px;border-left:3px solid var(--present);padding:6px 0 6px 12px;color:var(--muted)}
.confirm{border:1px solid var(--alert);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
footer{font-size:12px;color:var(--muted)}
@media (max-width:380px){.stat strong{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
.backlink{display:inline-block;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:4px}.backlink:hover{color:var(--ink)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.userbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.userbar .btn{padding:6px 12px;font-size:13px}
.cloud::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--future);margin-right:6px;vertical-align:1px}
.cloud.saving::before{background:var(--present)} .cloud.err{color:var(--alert)} .cloud.err::before{background:var(--alert)}
body:not(.authed) #app, body:not(.authed) .userbar{display:none}
body.authed #auth{display:none}
.auth-switch{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.auth-switch button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px;font:600 14px var(--body);color:var(--muted);cursor:pointer}
.auth-switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.af{display:flex;flex-direction:column;gap:12px}
.af label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.af input{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.af input:focus-visible{outline:3px solid var(--future);outline-offset:1px}
.amsg{font-size:14px;min-height:20px} .amsg.err{color:var(--alert)} .amsg.ok{color:var(--future)}
.linkbtn{background:none;border:0;padding:0;font:13px var(--body);color:var(--future);text-decoration:underline;cursor:pointer;align-self:flex-start}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:var(--future);flex:none}
</style>
</head>
<body>
<div class="wrap"><div class="topbar"><a class="backlink" href="../">← DayOne100 Tools</a><div class="userbar"><span id="who"></span><span class="cloud" id="cloud">Saved</span><button class="btn ghost" id="logout" type="button">Log out</button></div></div></div>
<section class="wrap" id="auth">
  <div class="eyebrow">DayOne100 Tools</div>
  <h1>Values Gap Finder</h1>
  <p class="muted">Log in with the same account as Idea Check. New here? Sign up with the class code from your teacher.</p>
  <div class="panel">
    <div class="auth-switch" role="group" aria-label="Log in or sign up"><button type="button" id="mLogin" aria-pressed="true">Log in</button><button type="button" id="mSignup" aria-pressed="false">Sign up</button></div>
    <form class="af" id="af" novalidate>
      <label id="lName" hidden>Your first name<input id="aName" autocomplete="given-name" maxlength="80"></label>
      <label id="lEmail">Email<input id="aEmail" type="email" autocomplete="email"></label>
      <label>Password<input id="aPass" type="password" autocomplete="current-password" minlength="8"></label>
      <label id="lCode" hidden>Class code<input id="aCode" autocomplete="off" placeholder="From your teacher" style="text-transform:uppercase"></label>
      <button class="btn" type="submit" id="aGo">Log in</button>
      <div class="amsg" id="amsg" role="status"></div>
      <button class="linkbtn" type="button" id="forgot">Forgot your password?</button>
    </form>
  </div>
  <p class="muted small">Your answers are private. Your teacher only sees whether you started and finished, never your answers.</p>
</section>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
const V = [
 {n:"Achievement", d:"Drive to excel, reach goals and show expertise.",
  f:["In ten years, I want to be known as one of the best at what I do.","In ten years, I want to have reached ambitious goals that I set for myself."],
  p:["Right now, I am excelling and hitting the goals that matter to me.","In my current life, I regularly get to compete and prove my expertise."]},
 {n:"Wealth", d:"How much wealth you want, and how much you prioritise pursuing it.",
  f:["In ten years, I want to be wealthy, not just comfortable.","In ten years, I want money to be a deliberate priority in how I make choices."],
  p:["Right now, I am building wealth at the pace I want.","My current work and choices are clearly moving me toward financial abundance."]},
 {n:"Autonomy", d:"Need to control your own direction, decisions and details.",
  f:["In ten years, I want to be fully in control of my own decisions and schedule.","In ten years, I want to answer to no one about how I live and work."],
  p:["Today, I decide for myself how I spend my days.","Right now, few people or rules constrain my choices."]},
 {n:"Beauty", d:"Importance of aesthetics: spaces, objects and people, yourself included.",
  f:["In ten years, I want to be surrounded by beautiful spaces and objects.","In ten years, I want how things look, including me, to reflect real care."],
  p:["My home and surroundings currently look and feel the way I want.","Right now, I make time and budget for beauty and aesthetics in my life."]},
 {n:"Belonging", d:"Value of friendship, community, or both.",
  f:["In ten years, I want to be part of a close circle of friends or a community.","In ten years, I want group connection to be central to my weeks."],
  p:["Right now, I feel truly embedded in a group of people I care about.","I currently see my friends or community as often as I would like."]},
 {n:"Love", d:"Romantic love as a shaping force in your life.",
  f:["In ten years, I want a deep romantic partnership at the heart of my life.","In ten years, I want my love relationship to shape my major decisions."],
  p:["Right now, my romantic relationship gets the time and attention I want it to have.","Currently, romantic love is a living, central part of my days."]},
 {n:"Faith", d:"Guidance and meaning from faith or a spiritual higher power.",
  f:["In ten years, I want my faith or spirituality to guide how I live.","In ten years, I want regular spiritual practice to be part of my life."],
  p:["Right now, my spiritual beliefs actively shape my decisions.","I currently make room for spiritual practice as much as I would like."]},
 {n:"Enjoyment", d:"Organising life around pleasure, fun and enjoying the present.",
  f:["In ten years, I want plenty of time for fun, pleasure and adventure.","In ten years, I want to enjoy life now rather than postpone happiness."],
  p:["Right now, I regularly do things purely because they are enjoyable.","My current life has enough play, rest and adventure."]},
 {n:"Family", d:"How much your immediate family should shape your life's direction.",
  f:["In ten years, I want my immediate family to set the direction of my life.","In ten years, I want family to come first when I decide how to spend my time."],
  p:["Right now, my family's needs shape most of my big choices.","I currently spend the time with my family that I want to."]},
 {n:"Recognition", d:"Desire for fame, public recognition and visibility.",
  f:["In ten years, I want to be widely recognised by people I have never met.","In ten years, I want a strong public profile and visible reputation."],
  p:["Right now, I have the visibility and public recognition I want.","Currently, people outside my own circle know who I am and what I do."]},
 {n:"Service", d:"Helping others through direct, personal impact.",
  f:["In ten years, I want helping individual people to be a core part of my days.","In ten years, I want to know I directly improved specific people's lives."],
  p:["Right now, I regularly help other people one-on-one.","My current work or life gives me enough chances to make a direct difference for someone."]},
 {n:"Place", d:"Need to live in a specific location or type of place.",
  f:["In ten years, I want to live in one specific place or type of place.","In ten years, I want location to be non-negotiable in my plans."],
  p:["I currently live exactly where I want to live.","My present surroundings, the city or landscape, feel like home."]},
 {n:"Impact", d:"Wanting to change the world at a systemic scale.",
  f:["In ten years, I want to be part of changing a system, an industry or society.","In ten years, I want my work to have impact far beyond the people I meet."],
  p:["Right now, I am actively contributing to large-scale change.","My current work affects systems, not just individuals."]},
 {n:"Exploration", d:"How big a life you want: excitement, learning and the new.",
  f:["In ten years, I want a big life full of new experiences, learning and excitement.","In ten years, I want to be constantly exploring new places, ideas or ventures."],
  p:["Right now, my life has plenty of novelty and excitement.","I am currently learning and trying new things as much as I want."]},
 {n:"Self-expression", d:"Expressing your authentic self, mind, body and soul.",
  f:["In ten years, I want to express who I really am without holding back.","In ten years, I want creative self-expression in everything I do."],
  p:["Right now, I can be fully myself at work and at home.","I currently have enough outlets to express my ideas and creativity."]},
 {n:"Work", d:"Work as the organising principle of your life, by choice.",
  f:["In ten years, I want work to be the organising centre of my life, by choice.","In ten years, I want my work to be a main source of my identity."],
  p:["Right now, my work is central to who I am and how I spend my time.","My current work feels like a core part of my identity, not just a means to an end."]}
];
// Value indices: 0 Achievement,1 Wealth,2 Autonomy,3 Beauty,4 Belonging,5 Love,6 Faith,7 Enjoyment,8 Family,9 Recognition,10 Service,11 Place,12 Impact,13 Exploration,14 Self-expression,15 Work
const CONFLICTS=[
 [8,15,"Both want to be the centre of your time. Every week, one of them will lose hours to the other."],
 [2,4,"Autonomy wants to steer alone; Belonging wants to be part of the group. Shared plans will feel like a cost to one side."],
 [13,11,"Exploration pulls toward the new and the far away; Place pulls toward one home. Moves and long trips become hard calls."],
 [7,0,"Enjoyment wants to enjoy life now; Achievement wants to push for excellence, which often means postponing fun."],
 [1,10,"Wealth rewards maximising income; Service asks for time spent on people, often unpaid or underpaid."],
 [1,7,"Earning more usually means working more. Enjoying now usually means working less."],
 [12,8,"Changing systems takes long hours and travel. Family wants you close and available."],
 [2,5,"Autonomy wants full control of decisions; a deep partnership means deciding together."],
 [9,5,"Recognition pulls toward public life; Love asks for private time and attention at home."],
 [2,15,"Strong work identity in someone else's structure clashes with wanting to answer to no one. The usual answer is owning the work."]
];
// m: what it means when this value is core; h: ways to live it more; c: work activities that feed it
const INFO=[
 {m:"You come alive when you are getting better, winning and being recognised as excellent. Without a clear bar to clear, you feel flat.",
  h:["Set one stretch goal with a date and a visible scoreboard.","Put yourself where you are measured: a competition, certification, award or target.","Ask someone better than you for direct feedback once a month."],
  c:["Competing against a clear target", "Mastering a craft or specialism", "Selling and negotiating", "Leading and making decisions", "Building something new from scratch"]},
 {m:"Money is a real driver for you, not a side effect. Financial progress gives you security, freedom and a way to keep score.",
  h:["Know your numbers: target wealth, current position and the gap.","Raise your prices or negotiate pay based on the value you deliver.","Build one asset that earns without your hours: equity, property or a product."],
  c:["Selling and negotiating", "Investing and growing money", "Building something new from scratch", "Owning products or assets that earn", "Leading and making decisions"]},
 {m:"You need to steer your own course. Being told what to do, how and when, drains you even when the work itself is good.",
  h:["Ask to fully own one area of decisions in your work.","Block time in your calendar that nobody else can book.","Move toward your own business, or contracts where you set the terms."],
  c:["Setting your own terms and schedule", "Building something new from scratch", "Advising clients independently", "Solving new, unfamiliar problems", "Investing and growing money"]},
 {m:"How things look and feel matters deeply to you. Ugly or careless surroundings genuinely lower your mood and energy.",
  h:["Fix the one space you use most every day.","Buy fewer, better things and get rid of what irritates you.","Make regular time for design, art or nature that moves you."],
  c:["Designing spaces, products or visuals", "Making things with your hands", "Creating experiences people enjoy", "Performing or creating art"]},
 {m:"Being part of a close group is a core need. You do your best in real connection, and isolation costs you more than most.",
  h:["Put a recurring date with friends in your calendar.","Join or start a group around something you care about.","Choose teams, clients and partners you actually like being around."],
  c:["Working in a close team", "Hosting and bringing people together", "Training people or explaining things", "Coaching or mentoring someone", "Serving a local community"]},
 {m:"Romantic love is a central organising force for you. Time and attention for your partner is not optional, it is the point.",
  h:["Protect weekly time with your partner, phones away.","Plan something for the future together.","Ask your partner what would make them feel prioritised, and do it."],

function status(g){

  if(g>=20)return "There is clear room to grow. You live part of this value, but less than you want.";
  if(g<=-20)return "You live this more than you want. It may take time and energy that your higher values need.";
  return "You live this value about as much as you want. Protect it.";
}

function raw(){
  const r=V.map((v,ix)=>({ix,n:v.n,d:v.d,f:0,p:0}));
  ORDER.forEach(([v],i)=>{r[v].f+=S.f[i];r[v].p+=S.p[i]});
  r.forEach(x=>{x.f=Math.round(((x.f/2)-1)/4*100);x.p=Math.round(((x.p/2)-1)/4*100);x.g=x.f-x.p});
  return r;
}

function scores(){

  $("redo").onclick=()=>{
    if(S.example){S=fresh();S.screen=CONSENT?"quiz":"intro";render();return}
    const c=$("confirm");
    c.innerHTML=`<div class="confirm"><p>This clears all answers, your top 5 and your plan. Start over?</p><div class="row"><button class="btn" id="yes">Clear and restart</button><button class="btn ghost" id="no">Keep my results</button></div></div>`;
    $("yes").onclick=()=>{S=fresh();S.screen="quiz";render()};
    $("no").onclick=()=>{c.innerHTML=""};
  };
}
function row(x){
  return `<div class="vrow">
    <span class="rk">${x.rank}</span><span class="nm">${x.n}</span><span class="gap ${gapCls(x.g)}">${gapTxt(x.g)}</span>
    <div class="bars">
      <div class="bar f"><span>Want</span><b><i style="width:${x.f}%"></i></b><span>${x.f}</span></div>
      <div class="bar p"><span>Living</span><b><i style="width:${x.p}%"></i></b><span>${x.p}</span></div>
    </div>
    <span class="def">${esc(x.d)}</span>
    <details class="more"><summary>What it means and what to do</summary>
      <p class="muted">${esc(INFO[x.ix].m)} ${status(x.g)}</p>
      <ul>${INFO[x.ix].h.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>
      <div class="careers">${INFO[x.ix].c.map(c=>`<span>${esc(c)}</span>`).join("")}</div>
    </details>
  </div>`;
}
function careerFit(core){
  const m={};
  core.forEach((x,i)=>INFO[x.ix].c.forEach(c=>{m[c]=m[c]||{name:c,score:0,vals:[]};m[c].score+=5-i;m[c].vals.push(x.n)}));
  return Object.values(m).sort((a,b)=>b.vals.length-a.vals.length||b.score-a.score).slice(0,5);
}
// Existing users who finished before ranking existed go to the ranking step
/* ---------- login ---------- */
let mode="login";
function amsg(t,ok){const el=$("amsg");el.textContent=t||"";el.className="amsg"+(t?(ok?" ok":" err"):"")}
function setMode(m){mode=m;$("mLogin").setAttribute("aria-pressed",String(m==="login"));$("mSignup").setAttribute("aria-pressed",String(m==="signup"));
  $("lName").hidden=m!=="signup";$("lCode").hidden=m!=="signup";$("lEmail").hidden=m==="reset";$("forgot").hidden=m!=="login";
  $("aGo").textContent=m==="signup"?"Create my account":m==="reset"?"Save my new password":"Log in";amsg(m==="reset"?"Choose a new password of at least 8 characters.":"",m==="reset")}
$("mLogin").onclick=()=>setMode("login");$("mSignup").onclick=()=>setMode("signup");
$("af").onsubmit=async ev=>{
  ev.preventDefault();
  if(!sb){amsg("This tool is not connected to its database yet. Tell your teacher.");return}
  const email=$("aEmail").value.trim(),pass=$("aPass").value,btn=$("aGo");
  if(mode!=="reset"&&(!email||!pass)){amsg("Fill in your email and password.");return}
  btn.disabled=true;
  try{
    if(mode==="reset"){if(pass.length<8){amsg("Use a password of at least 8 characters.");return}const {error}=await sb.auth.updateUser({password:pass});if(error){amsg(error.message);return}amsg("Password saved.",true);setMode("login");const {data}=await sb.auth.getSession();if(data.session)afterLogin(data.session.user)}
    else if(mode==="signup"){const name=$("aName").value.trim(),code=$("aCode").value.trim().toUpperCase();
      if(!name||!code){amsg("Fill in your first name and the class code.");return}
      if(pass.length<8){amsg("Use a password of at least 8 characters.");return}
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name,class_code:code}}});
      if(error){amsg(/database error|class_code/i.test(error.message)?"That class code is not valid. Check it with your teacher.":/already|registered|exists/i.test(error.message)?"This email already has an account. Log in instead.":error.message);return}
      if(!data.session){amsg("Account created. Check your email to confirm it, then log in.",true);setMode("login")}}
    else{const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error){amsg(/invalid/i.test(error.message)?"That email or password is not right.":error.message);return}}
  }catch(e){amsg("Could not reach the server. Check your connection and try again.")}
  finally{btn.disabled=false}
};
$("forgot").onclick=async()=>{const email=$("aEmail").value.trim();if(!email){amsg("Type your email first, then click this again.");return}if(!sb)return;
  await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});amsg("If that email has an account, a reset link is on its way.",true)};
async function afterLogin(user){
  if(ME&&ME.id===user.id)return;
  ME=user;
  const [p,v]=await Promise.all([sb.from("profiles").select("name").eq("id",user.id).maybeSingle(),sb.from("values_results").select("data,consent_at,completed_at").eq("user_id",user.id).maybeSingle()]);
  const row=v.data;
  CONSENT=row&&row.consent_at||null; COMPLETED=row&&row.completed_at||null;
  S=valid(row&&row.data)||load()||fresh(); S.example=false;
  if(S.screen==="results"&&S.rank.length<5)S.screen="rank";
  $("who").textContent=(p.data&&p.data.name)||user.email||"";
  document.body.classList.add("authed");
  render();cloudState("","Saved");
}
$("logout").onclick=async()=>{if(cloudTimer)await cloudSave();await sb.auth.signOut();ME=null;CONSENT=null;COMPLETED=null;S=fresh();document.body.classList.remove("authed");setMode("login");$("aPass").value=""};
setMode("login");
if(!sb)amsg("This tool is not connected to its database yet. Tell your teacher.");
else{
  sb.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"){setTimeout(()=>setMode("reset"),0);return}if(session&&session.user&&mode!=="reset")setTimeout(()=>afterLogin(session.user),0)});
  sb.auth.getSession().then(({data})=>{if(data.session&&mode!=="reset")afterLogin(data.session.user)});
}
</script>
