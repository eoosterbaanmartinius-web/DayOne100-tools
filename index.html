<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DayOne100 Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
:root{--bg:#0F192C;--surface:#132038;--line:#2A3A58;--fg:#E8EDF6;--muted:#93A1BA;--gold:#D99B26;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:56px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin:8px 0 8px;text-wrap:balance}
p{color:var(--muted);margin:0 0 28px;max-width:60ch}
a.tool{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;color:inherit;text-decoration:none;transition:border-color .15s}
a.tool:hover,a.tool:focus-visible{border-color:var(--gold);outline:none}
a.tool b{font-size:18px;display:block}
a.tool span{color:var(--muted);font-size:14px}
footer{margin-top:40px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">DayOne100 Tools</div>
  <h1>Tools for student entrepreneurs</h1>
  <p>Practical tools from DayOne100 for students at Team Academy Amsterdam. Log in with the class code from your teacher.</p>
  <a class="tool" href="ideacheck/"><b>Idea Check</b><span>Score your business ideas, test your hypotheses and talk to the AI Business Coach.</span></a>
  <footer>DayOne100 · dayone100.nl</footer>
</div>
</body>
</html>
