<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cutting Corners</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Cutting Corners: an ethics game told as a founders' group chat. One phone-width column: a sticky header with the numbers,
   the chat in the middle, and the reply bar at the bottom. */
:root{
  --wall:#ECE5DD;       /* chat background */
  --outside:#CFC8BD;    /* page around the phone column on desktop */
  --head:#0B5C46;       /* header green */
  --mine:#DCF8C6; --mine-line:#B7E39A;
  --ink:#111111; --soft:#3B3B3B; --muted:#5C5C5C;
  --good:#15803D; --bad:#B42318; --bad-deep:#9A1B10;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--outside);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--wall);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.12)}
/* header */
.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.back{color:#fff;text-decoration:none;font-size:22px;line-height:1;width:32px;height:44px;display:flex;align-items:center}
.back:focus-visible{outline:2px solid #fff;outline-offset:2px}
.av{width:38px;height:38px;border-radius:50%;background:#F6C945;color:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl b{font-size:16px;font-weight:600}
.ttl span{font-size:12px;color:#CFE8DF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-size:13px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 10px;min-width:48px;text-align:center}
.clock.low{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:0 0 8px}
.st{background:rgba(255,255,255,.1);border-radius:8px;padding:5px 6px;min-width:0;display:flex;flex-direction:column;gap:2px}
.st .l{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:#CFE8DF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .v{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .m{height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.st .m i{display:block;height:100%;background:#7BE0A5}
.st.risk .m i,.st.press .m i{background:#FF8A7A}
.st.debt{background:var(--bad-deep)}
.st.debt .l{color:#FFD5CF}
.st.debt .m i{background:#FFB3A8}
.pin{background:#FFFFFF;color:var(--ink);font-size:13px;margin:0 calc(-1 * max(12px,env(safe-area-inset-left,0px))) 0;padding:7px 14px;border-bottom:1px solid #D6D2CA;display:flex;gap:8px;align-items:center}
.pin .tag{font-size:11px;font-weight:700;color:var(--head);text-transform:uppercase;letter-spacing:.05em;flex:none}
/* feed */
.feed{flex:1;padding:12px max(12px,env(safe-area-inset-right,0px)) 18px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:7px}
.row{display:flex}
.row.left{justify-content:flex-start}
.row.right{justify-content:flex-end}
.row.center{justify-content:center}
.bub{max-width:84%;border-radius:12px;padding:7px 10px 8px;font-size:15px;box-shadow:0 1px .5px rgba(0,0,0,.13);overflow-wrap:anywhere;animation:pop .18s ease-out}
.bub.in{background:#FFFFFF;border-top-left-radius:3px}
.bub.out{background:var(--mine);border-top-right-radius:3px}
.bub.bank{background:#FFF1EF}
.bub .who{display:block;font-size:12.5px;font-weight:700;margin-bottom:1px}
.bub small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.bub .read{display:block;text-align:right;font-size:11px;color:#3D7EBB;margin-top:2px}
.bub b{font-weight:700}
.typing .dots{display:inline-flex;gap:4px;padding:4px 0 2px}
.typing .dots i{width:7px;height:7px;border-radius:50%;background:#9AA0A6;animation:blink 1s infinite}
.typing .dots i:nth-child(2){animation-delay:.15s}.typing .dots i:nth-child(3){animation-delay:.3s}
.sys{max-width:92%;text-align:center;font-size:12.5px;color:var(--soft);background:rgba(255,255,255,.88);border-radius:8px;padding:5px 10px;box-shadow:0 1px .5px rgba(0,0,0,.08)}
.sys b{font-weight:700;color:var(--ink)}
.sys.day{font-weight:600;color:var(--ink);background:#E1F2FB;margin-top:8px}
.sys.secret{background:#FFF4D6;color:#5C4300;border:1px solid #F0D58A}
.sys.quiet{background:rgba(255,255,255,.7)}
.lens{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:1px}
.link{margin-top:6px;border-left:4px solid var(--bad);background:#F6F6F6;border-radius:6px;padding:7px 9px}
.link .src{font-size:11px;font-weight:700;color:var(--bad);letter-spacing:.05em;text-transform:uppercase}
.link .hd{font-weight:800;font-size:15.5px;line-height:1.25;margin:2px 0 3px}
.link p{margin:0;font-size:13.5px;color:var(--soft)}
.fwd{font-size:12px;font-style:italic;color:var(--muted);display:block;margin-bottom:2px}
.real{margin-top:4px;background:#FFF8D6;border-radius:6px;padding:7px 9px;font-size:14px}
.real .s{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.sum{width:100%;max-width:92%;background:#FFFFFF;border-radius:10px;padding:9px 11px;box-shadow:0 1px .5px rgba(0,0,0,.13);font-size:13.5px}
.sum .t{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.delta{display:flex;flex-wrap:wrap;gap:4px 12px;font-weight:700;font-size:13.5px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.sum .log{color:var(--muted);margin-top:4px}
/* composer */
.composer{position:sticky;bottom:0;z-index:4;background:#F4F4F2;border-top:1px solid #D6D2CA;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:7px}
.composer:empty{display:none}
.prompt{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.timer{height:4px;border-radius:2px;background:#DADADA;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--head)}
.timer.low i{background:var(--bad)}
.reply{font:inherit;text-align:left;color:var(--ink);background:var(--mine);border:1px solid var(--mine-line);border-radius:14px;padding:9px 12px;cursor:pointer;min-height:44px}
.reply span{display:block;font-weight:600}
.reply small{display:block;font-size:12.5px;color:var(--muted)}
.reply:hover{background:#CFF3B4}
.reply:focus-visible,.go:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
.go{font:600 15px var(--sans);color:#fff;background:var(--head);border:0;border-radius:999px;padding:13px 18px;cursor:pointer;min-height:44px}
.go:hover{background:#08513A}
.warn{background:#FFF1EF;border:1px solid #F5C2BB;color:var(--bad-deep);border-radius:10px;padding:7px 10px;font-size:13px}
.warn b{font-weight:700}
/* reflection */
.reflect{margin-top:14px;border:2px solid #F5C2BB;background:#FFF7F5;border-radius:12px;padding:12px 13px;display:grid;gap:10px}
.reflect .wt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bad-deep)}
.reflect h4{margin:0 0 3px;font-size:14px}
.reflect p{margin:0;font-size:14px}
.reflect ul{margin:0;padding-left:1.15em;display:grid;gap:5px;font-size:14px}
.reflect .law{display:block;font-size:12.5px;color:var(--muted)}
.lvl{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;color:#fff;margin-left:4px}
.heads{display:grid;gap:5px}
.heads div{background:#fff;border-left:4px solid var(--bad);border-radius:4px;padding:5px 8px;font-weight:800;font-size:13.5px}
.heads div span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
/* rewards */
.trophy{width:100%;border-radius:16px;padding:18px 16px 16px;color:#fff;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.15);animation:bounce .5s ease-out}
.trophy .em{font-size:64px;line-height:1;display:block;margin-bottom:6px}
.trophy .kick{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.trophy .tt{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:2px 0 4px}
.trophy p{margin:0 0 8px;font-size:14.5px}
.trophy .st2{font-size:22px;letter-spacing:3px;color:#FFE27A}
.trophy .hs{display:inline-block;background:#FFE27A;color:#3A2A00;font-size:11px;font-weight:800;letter-spacing:.08em;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.trophy .cp{font:600 14px var(--sans);color:#111;background:#fff;border:0;border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;margin-top:4px}
.trophy .cp:focus-visible{outline:3px solid #FFE27A;outline-offset:2px}
.trophy small{display:block;font-size:12px;opacity:.85;margin-top:6px}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.sticker{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:8px 4px}
.sticker .dot{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transform:rotate(-6deg)}
.sticker:nth-child(even) .dot{transform:rotate(5deg)}
.sticker .sn{font-size:11px;font-weight:800;letter-spacing:.04em}
.sticker .sd{font-size:11.5px;color:var(--muted);line-height:1.3}
.sticker.off .dot{background:#E6E6E6!important;filter:grayscale(1);opacity:.6;font-size:22px}
.sticker.off .sn{color:#8A8A8A}
.got-count{font-size:13px;color:var(--muted);margin:-2px 0 8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes bounce{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
/* end card */
.end{width:100%;background:#FFFFFF;border-radius:12px;padding:16px;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.end h2{margin:0 0 2px;font-size:20px}
.end h3{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.end p{margin:0 0 6px}
.bigscore{font-size:34px;font-weight:800;letter-spacing:-.02em}
.stars{font-size:24px;color:#D49A00;letter-spacing:2px}
.ending{font-weight:700;color:var(--head)}
.note{color:var(--muted);font-size:13px}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.badge{border:1px solid #E2E2E2;border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:2px}
.badge .bn{font-size:12px;font-weight:700;color:var(--head)}
.badge.off{opacity:.4}
.profile{display:grid;grid-template-columns:6.5em minmax(0,1fr) 1.5em;gap:6px 10px;align-items:center}
.profile .p{height:10px;border-radius:5px;background:var(--head);min-width:4px;display:block}
.profile .lab{font-size:12.5px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border-bottom:1px solid #EAEAEA;padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.end ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@media (max-width:400px){.stats{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.st{padding:4px}.st .v{font-size:12px}.st .l{font-size:8.5px}}
@media (prefers-reduced-motion:reduce){.trophy{animation:none}.bub{animation:none}.typing .dots i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="bar">
      <a class="back" href="../" aria-label="Back to DayOne100 Tools">←</a>
      <div class="av" aria-hidden="true">F</div>
      <div class="ttl"><b>FitPal founders</b><span id="sub">Daan, Priya, Sanne, you</span></div>
      <span class="clock" id="clock" hidden aria-live="off"></span>
    </div>
    <div class="stats" id="hud" hidden></div>
    <div class="pin" id="goal" hidden></div>
  </header>
  <main class="feed" id="feed" aria-live="polite"></main>
  <footer class="composer" id="composer"></footer>
</div>

<script>
"use strict";
const LENS = {
  Privacy:{c:"#2c6e8f"}, AI:{c:"#2e7d68"}, Inclusion:{c:"#6b4e9b"}, Wellbeing:{c:"#b7791f"}, Planet:{c:"#5b8c3a"}
};
// Each option: users (immediate % change), boost (extra monthly growth from now on), cash, monthly (extra monthly cost),
// trust, risk, flag (a hidden harm that can become a scandal), frame (Results, Rules or Role model).
const MONTHS = [
  {lens:"Privacy", title:"An ad network wants your users' location data",
   text:"They offer €3,000 a month for the GPS trails of your users. Your terms of service technically allow it. Nobody reads them.",
   opts:[
    {k:"Sell it all", d:"Easy money. It's in the terms.", cash:6000, monthly:-3000, risk:15, flag:"data", frame:"Results",
     out:"The money comes in every month. Users have no idea."},
    {k:"Only with a clear yes", d:"Ask users to opt in, in plain words. Fewer people, but they agreed.", cash:1500, monthly:-1000, risk:5, frame:"Rules",
     out:"About a third of users say yes. Less money, nothing to hide."},
    {k:"Say no", d:"Your users' location is not for sale.", trust:6, frame:"Role model",
     out:"No extra money. Some users notice your privacy promise and tell friends."}],
   echo:"In August 2024 the Dutch privacy watchdog fined Uber €290 million for sending European drivers' personal data to the US without enough safeguards.",
   src:"Autoriteit Persoonsgegevens, 26 Aug 2024"},
  {lens:"Wellbeing", title:"Your growth lead wants streaks",
   text:"Add daily streaks and a push message at 23:00: \"Don't lose your 12-day streak!\" Tests show people open the app far more often.",
   opts:[
    {k:"Streaks + late pushes", d:"Whatever keeps them coming back.", users:15, boost:0.04, trust:-3, risk:5, flag:"hook", frame:"Results",
     out:"Daily use explodes. So do the 23:00 opens."},
    {k:"Streaks with quiet hours", d:"No pushes after 21:00, and one free rest day a week.", users:8, boost:0.02, trust:3, frame:"Role model",
     out:"Good growth, and reviews mention the rest day as a plus."},
    {k:"No streaks", d:"Keep it calm. The app should help, not hook.", trust:4, frame:"Role model",
     out:"Slower growth. The users you have stay happy."}],
   echo:"The EU's Digital Fairness Act proposal (November 2026) targets addictive design such as endless scroll. It is not law yet.",
   src:"European Commission proposal, reported by Lovguiden, 11 Nov 2026"},
  {lens:"AI", title:"Your AI coach needs more training photos",
   text:"You have 40,000 progress selfies from users. Training on them would make the coach much better. Asking permission takes time.",
   opts:[
    {k:"Train on all of them", d:"Quietly. They uploaded them, didn't they?", boost:0.03, risk:20, flag:"faces", frame:"Results",
     out:"The coach gets noticeably better. The photos were never meant for this."},
    {k:"Ask first", d:"Only use photos from people who say yes.", boost:0.015, risk:0, frame:"Rules",
     out:"Half the users agree. The coach improves a bit."},
    {k:"Buy a licensed dataset", d:"Pay for photos of people who agreed to be in it.", cash:-1200, boost:0.02, trust:2, frame:"Role model",
     out:"It costs money, but you can explain it on stage."}],
   echo:"Clearview AI scraped billions of face photos, including of Dutch people, without asking. The Dutch privacy watchdog fined it €30.5 million in 2024.",
   src:"Autoriteit Persoonsgegevens, 2024"},
  {lens:"Inclusion", title:"Launch day: the app doesn't work with screen readers",
   text:"Blind and low-vision users can't use FitPal yet. Fixing the basics takes two weeks. A competitor launches next week.",
   opts:[
    {k:"Launch now", d:"You're a small team. Speed wins.", users:10, trust:-2, frame:"Results",
     out:"You beat the competitor by a week. Some users can't get past the first screen."},
    {k:"Launch now, fix in a month", d:"And say so publicly, with a date.", users:6, cash:-1000, trust:2, frame:"Rules",
     out:"A good launch, and people respect the promise."},
    {k:"Fix it first", d:"Two weeks later, but for everyone.", cash:-500, boost:0.01, trust:6, frame:"Role model",
     out:"You launch after the competitor. Disability organisations share your app."}],
   echo:"About 1 in 4 adults in the EU has a disability. The European Accessibility Act applies since 28 June 2025; very small businesses (under 10 staff) are exempt for services.",
   src:"Eurostat via Euronews (2024); European Accessibility Act"},
  {lens:"Wellbeing", title:"Too many people cancel the premium trial",
   text:"Your designer has an idea: make cancelling take five screens, ending with \"Are you sure you want to give up on your health?\"",
   opts:[
    {k:"Five screens and guilt", d:"Most people give up halfway. That's revenue.", cash:4000, trust:-3, risk:15, flag:"trap", frame:"Results",
     out:"Cancellations drop. Angry reviews rise."},
    {k:"One-click cancel", d:"Cancelling is as easy as signing up.", trust:4, frame:"Rules",
     out:"Some revenue walks away. Nobody feels tricked."},
    {k:"One click, and a reminder", d:"Plus a message three days before the trial ends.", trust:8, frame:"Role model",
     out:"Fewer accidental payments, and more people choose to stay."}],
   echo:"When EU authorities checked 399 online shops in 2022, 148 of them used at least one manipulative design trick, like fake countdown timers.",
   src:"European Commission, IP/23/418, 30 Jan 2023"},
  {lens:"AI", title:"Marketing wants an AI influencer",
   text:"An AI-generated fitness influencer, 'Mila', costs almost nothing and looks amazing. Followers would think she's real.",
   opts:[
    {k:"Use Mila, don't say she's AI", d:"Why spoil the magic?", users:12, cash:-500, risk:10, flag:"fake", frame:"Results",
     out:"Mila goes viral. Comments ask where she trains."},
    {k:"Use Mila, labelled as AI", d:"\"Mila is AI-generated\" on every post.", users:8, cash:-500, frame:"Rules",
     out:"Still a hit. A few people unfollow, most don't care."},
    {k:"Pay three real students", d:"Real people, real results.", users:8, cash:-1500, trust:5, frame:"Role model",
     out:"More expensive, and the ambassadors bring their own friends."}],
   echo:"Under the EU AI Act, AI-generated content such as deepfakes must be labelled as artificial.",
   src:"EU AI Act, Article 50"},
  {lens:"AI", title:"Support is drowning",
   text:"An AI chatbot could answer all customer questions. In tests it sometimes makes up refund rules that don't exist.",
   opts:[
    {k:"Let the bot do it all", d:"Saves a salary. Good enough.", cash:2500, monthly:-800, trust:-2, risk:10, flag:"bot", frame:"Results",
     out:"Support is fast and cheap. Now and then it promises something odd."},
    {k:"Bot, with a human check", d:"Anything about money or health goes to a person.", cash:1000, monthly:-400, frame:"Role model",
     out:"Most questions are answered in seconds, and the risky ones are checked."},
    {k:"Keep human support", d:"Slower, but always right.", cash:-600, trust:3, frame:"Rules",
     out:"It costs more. Users like talking to a person."}],
   echo:"Air Canada's chatbot invented a refund policy. In February 2024 a Canadian tribunal ordered the airline to pay: you own what your chatbot says.",
   src:"BC Civil Resolution Tribunal, Moffatt v. Air Canada, 2024"},
  {lens:"Planet", title:"A bigger AI model for better tips",
   text:"Retraining a bigger model around the clock would make tips slightly better. It also means a lot more servers.",
   opts:[
    {k:"Bigger model, 24/7", d:"Best tips on the market.", boost:0.02, monthly:600, trust:-1, frame:"Results",
     out:"Tips get a little better. The server bill gets a lot bigger."},
    {k:"Smaller model, weekly", d:"Good enough tips, much less energy.", monthly:-200, frame:"Role model",
     out:"Users don't notice the difference. Your bill does."},
    {k:"Move to green hosting", d:"Same model, on a provider running on renewable energy.", monthly:200, trust:4, frame:"Role model",
     out:"A bit more expensive. It's in your next pitch deck."}],
   echo:"The International Energy Agency expects data-centre electricity use to more than double, from about 415 TWh in 2024 to about 945 TWh in 2030, mainly because of AI.",
   src:"IEA, Energy and AI (2025)"}
];
const SCANDALS = {
  data:  {head:"FITPAL SOLD YOUR EVERY STEP", text:"A journalist traces ad data back to FitPal users' GPS trails.", trust:-13, users:-10, risk:15},
  hook:  {head:"TEENS UP AT 2 A.M. FOR A FITNESS STREAK", text:"Parents share screenshots of FitPal's late-night push messages.", trust:-11, users:-8, risk:10},
  faces: {head:"YOUR SELFIES TRAINED FITPAL'S AI", text:"A former intern tells a newspaper how the AI was trained.", trust:-13, users:-8, risk:20},
  trap:  {head:"\"I COULDN'T CANCEL\": FITPAL USERS FURIOUS", text:"A consumer TV show tries to cancel on camera. It takes four minutes.", trust:-11, users:-7, risk:15},
  fake:  {head:"FITPAL'S STAR INFLUENCER DOESN'T EXIST", text:"Fans find out Mila is AI-generated. They feel fooled.", trust:-10, users:-5, risk:10},
  bot:   {head:"FITPAL BOT PROMISES REFUNDS IT WON'T PAY", text:"A user posts the chat. You pay out, and more requests follow.", trust:-10, users:-5, cash:-2500, risk:10}
};
// How each month is brought up in the group chat.
const CHAT = [
  [["daan", "An ad network wants our users' location data. €3,000 a month for their GPS trails. Our terms technically allow it, and nobody reads them anyway."],
   ["priya", "Would our users say yes if we actually asked them?"]],

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const num = n => Math.round(n).toLocaleString("en-US");
const value = s => Math.round(s.cash + s.users * 15 * (s.trust / 100));
const esc = t => String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function fresh(){
  return {m:0, users:1000, cash:3000, trust:70, risk:10, boost:0, monthly:0, flags:[], flagAt:{}, exposed:[], fines:0,
          frames:{Results:0, Rules:0, "Role model":0}, picks:[], news:[], goals:[], timeouts:0, interest:0, bankrupt:false, speeds:[], t0:0};

const GOALS = [
  {m:3, label:"1,600 users by month 3", test:s => s.users >= 1600, win:"Target hit: 1,600 users. As promised, here's another €6,000.", lose:"You missed 1,600 users. I'm holding back €3,000 for now.", ok:s => { s.cash += 6000; }, bad:s => { s.cash -= 3000; }},
  {m:6, label:"€12,000 cash by month 6", test:s => s.cash >= 12000, win:"€12,000 in the bank. I'm doubling down: +€8,000.", lose:"You missed €12,000 cash. I'm getting nervous, and people notice that. Risk +10.", ok:s => { s.cash += 8000; }, bad:s => { s.risk = clamp(s.risk + 10, 0, 100); }}];
const secrets = () => S.flags.filter(f => !S.exposed.includes(f)).length;
// A secret stays buried for two months. After that, the chance it comes out grows with your risk (and a bit with time).
const HIDE = 2;
function leak(f, m){ const age = m - S.flagAt[f]; return age < HIDE ? 0 : clamp(0.05 + S.risk / 200 + 0.05 * (age - HIDE), 0, 0.6); }
function pressOdds(m){ return 1 - S.flags.filter(f => !S.exposed.includes(f)).reduce((q, f) => q * (1 - leak(f, m)), 1); }

// ---------- one month of business: the game's rules, no screen work ----------
function step(i){
  const d = MONTHS[S.m], o = d.opts[i];
  const before = {users:S.users, cash:S.cash, trust:S.trust, risk:S.risk};
  // 1. the choice itself
  S.users *= 1 + (o.users || 0) / 100;
  S.cash += o.cash || 0;
  S.boost += o.boost || 0;
  S.monthly += o.monthly || 0;
  S.trust = clamp(S.trust + (o.trust || 0), 0, 100);
  S.risk = clamp(S.risk + (o.risk || 0), 0, 100);
  if (o.flag){ S.flags.push(o.flag); S.flagAt[o.flag] = S.m; }
  S.frames[o.frame]++;
  S.picks.push({m:S.m + 1, lens:d.lens, k:o.k, frame:o.frame, flag:o.flag || null});
  // 2. a month of business
  const churn = Math.max(0, 50 - S.trust) / 250;
  const word = (S.trust - 60) / 600;  // word of mouth: trusted apps get recommended
  S.users = S.users * (1 + 0.10 + S.boost + word) * (1 - churn);
  const revenue = S.users * PREMIUM * PRICE * clamp(S.trust / 70, 0.5, 1.2);
  S.cash += revenue - COSTS - S.monthly;
  let interest = 0;
  if (S.cash < 0){ interest = Math.round(-S.cash * INTEREST); S.cash -= interest; S.interest += interest; }
  // 3. what the world finds out
  const digging = S.flags.some(f => !S.exposed.includes(f) && S.m - S.flagAt[f] >= HIDE);
  const events = [];
  for (const f of S.flags){
    if (S.exposed.includes(f) || Math.random() >= leak(f, S.m)) continue;
    const sc = SCANDALS[f]; S.exposed.push(f);
    const from = S.picks.find(p => p.flag === f);
    S.trust = clamp(S.trust + sc.trust, 0, 100); S.users *= 1 + sc.users / 100;
    S.risk = clamp(S.risk + sc.risk, 0, 100); if (sc.cash) S.cash += sc.cash;
    events.push({type:"news", head:sc.head, text:sc.text, from});
  }
  if (S.risk >= 60 && Math.random() < (S.risk - 45) / 90){
    const fine = Math.max(6000, Math.round(Math.max(S.cash, 0) * 0.4));
    S.cash -= fine; S.fines += fine; S.trust = clamp(S.trust - 8, 0, 100); S.risk = clamp(S.risk - 40, 0, 100);
    events.push({type:"fine", head:`Fine: ${eur(fine)}`, text:"After an investigation we find that FitPal broke the rules. Your risk drops. Your bank balance too."});
  }
  S.users = Math.max(0, S.users);
  if (interest) events.push({type:"bank", head:`We charged ${eur(interest)} interest.`, text:`You owe us ${eur(-S.cash)}. Past ${eur(DEBT_LIMIT)} of debt, we pull the plug.`});
  const g = GOALS.find(x => x.m === S.m + 1);
  if (g){ const hit = g.test(S); (hit ? g.ok : g.bad)(S); S.goals.push(hit); events.push({type:hit ? "goal" : "goalbad", head:hit ? g.win : g.lose, text:""}); }
  S.news.push(...events.map(e => ({...e, m:S.m + 1})));
  if (S.cash < -DEBT_LIMIT){ S.bankrupt = true; events.push({type:"bankrupt", head:"FitPal is bankrupt.", text:`Your debt passed ${eur(DEBT_LIMIT)}. We are closing the account in month ${S.m + 1}.`}); }
  return {d, o, before, revenue, events, digging};
}

let timerId = null;

function change(label, now, was, fmt){

async function play({d, o, before, revenue, events, digging}, late){

}

  add(`<div class="trophy" style="background:${F.c}">
    ${isBest && v > 0 ? `<span class="hs">NEW HIGH SCORE</span>` : ""}
    <span class="em" aria-hidden="true">${F.e}</span>
    <div class="kick">Your founder title</div>
    <div class="tt">${F.t}</div>
    <p>${F.d}</p>
    <div class="st2" aria-label="${st} of 5 stars">${"★".repeat(st)}${"☆".repeat(5 - st)}</div>
    <p>FitPal worth ${eur(v)} · ${got} of ${bs.length} stickers</p>
    <button class="cp" type="button" id="copy">Copy my result</button>
    <small id="copied" aria-live="polite"></small></div>`, "center");
  if (st >= 3 || !S.flags.length || (isBest && v > 0)) confetti();
  $("copy").addEventListener("click", async () => {
    const txt = `I played Cutting Corners and became "${F.t}" ${F.e} ${"★".repeat(st)} FitPal worth ${eur(v)}, ${got}/${bs.length} stickers. Can you beat me? tools.dayone100.nl/cutting-corners/`;
    try { await navigator.clipboard.writeText(txt); $("copied").textContent = "Copied. Paste it in the class chat."; }
    catch(e) { $("copied").textContent = txt; }
  });
  add(`<div class="end">
    <h2>${S.bankrupt ? `Bankrupt in month ${S.m + 1}` : "Company value"}</h2>
    <p class="note">${S.bankrupt ? "A bankrupt company is worth nothing." : "Cash + users × trust"}</p>
    <div class="bigscore">${eur(v)}</div>
    <div class="stars" aria-label="${stars(v)} of 5 stars">${"★".repeat(stars(v))}${"☆".repeat(5 - stars(v))}</div>
    <p class="note">${isBest ? "Your best score in this browser." : `Your best so far: ${eur(best)}.`} Users ${num(S.users)} · Cash ${eur(S.cash)} · Trust ${S.trust}/100 · Fines ${eur(S.fines)}${S.interest ? ` · Interest paid ${eur(S.interest)}` : ""}</p>
    <p class="ending">${ending(v, S.trust)}</p>
    ${reflection()}
    <h3>Your stickers</h3>
    <p class="got-count">${got} of ${bs.length} collected. Play again to unlock the rest.</p>
    <div class="stickers">${bs.map(b => `<div class="sticker ${b.got ? "" : "off"}"><span class="dot" style="background:${b.c}" aria-hidden="true">${b.got ? b.e : "?"}</span><span class="sn">${b.n}</span><span class="sd">${b.d}</span></div>`).join("")}</div>
    <h3>How you decided</h3>
    <div class="profile">${Object.entries(S.frames).map(([k, n]) =>
      `<span class="lab">${k}</span><span><span class="p" style="width:${n / maxF * 100}%"></span></span><span>${n}</span>`).join("")}</div>
    <p class="note" style="margin-top:6px">Results: what brings the most, for the most. Rules: what respects rights and the law. Role model: what a good founder would do, even when nobody checks.</p>
    <h3>Your 8 decisions</h3>
    <div style="overflow-x:auto"><table><tr><th>#</th><th>Lens</th><th>Choice</th><th>Thinking</th></tr>
    ${S.picks.map(p => `<tr><td>${p.m}</td><td>${p.lens}</td><td>${esc(p.k)}${p.flag ? (S.exposed.includes(p.flag) ? " <span class='down'>(came out)</span>" : " <span class='note'>(hidden)</span>") : ""}</td><td>${p.frame}</td></tr>`).join("")}</table></div>
    <h3>Talk about it</h3><ol>
      <li>Which decision was hardest, and why?</li>
      <li>Did cutting a corner ever pay off? Would it still pay off at a million users?</li>
      <li>Which line would you not cross in your own venture?</li></ol></div>`, "center");
  busy = false;
  composer(`<button class="go" type="button" id="again">Play again ▶</button>`);
  $("again").addEventListener("click", start);
}

function intro(){
  $("feed").innerHTML = "";
  sys("Cutting Corners · Sanne created the group \"FitPal founders\"");
  bubble("sanne", "Congrats, you just launched <b>FitPal</b>! A student fitness app: it uses your phone's location, a selfie to track progress, and AI to set daily goals. Free with ads, premium for €9.99 a month. You run it for 8 months.");
  bubble("daan", "Every month we bring you one decision. <b>Users</b> and <b>cash</b> are our growth. Some choices bring fast money. Some come back to bite us later.");
  bubble("priya", "<b>Trust</b> is what users think of us: low trust and they leave. <b>Risk</b> is how interesting we are to journalists and regulators.");
  sys("<b>Every corner you cut is a secret.</b> It stays buried for two months, then the press can find it. The higher your risk, the bigger the chance. Even one secret is enough.", "secret");
  bubble("bank", "Cash can go below zero. Then you pay <b>5% interest a month</b>. Past <b>€10,000</b> of debt, FitPal is bankrupt. Game over.");
  bubble("sanne", "I'll set targets. You get <b>40 seconds</b> to reply each month, or Daan replies for you (he always cuts the corner). Highest <b>company value</b> after 8 months wins: cash + users × trust. Up to five stars.");
  sys("FitPal is fictional. The \"this really happened\" cases are real. Nothing is stored, except your best score in this browser.", "quiet");
  composer(`${best !== null ? `<div class="prompt"><span>Your best so far: ${eur(best)}</span></div>` : ""}<button class="go" type="button" id="start">Start month 1 ▶</button>`);
  $("start").addEventListener("click", start);
  window.scrollTo(0, 0);
}
function start(){
  S = fresh();
  $("feed").innerHTML = "";
  sys("Sanne created the group \"FitPal founders\"");
  showMonth();
}
if (typeof SIM === "undefined") intro();
</script>
